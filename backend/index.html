<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexa AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0b0e14;
    --surface: #12161f;
    --surface-2: #171c27;
    --border: #232937;
    --text: #e8eaed;
    --text-dim: #8b92a5;
    --accent: #6c5ce7;
    --accent-soft: rgba(108, 92, 231, 0.15);
    --live: #00d9c0;
    --error: #ff6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(108, 92, 231, 0.12), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(0, 217, 192, 0.08), transparent 35%),
      var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .shell {
    width: 100%;
    max-width: 480px;
    animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .mark-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  .mark-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* Auth card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
  }

  .card h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px;
  }

  .card p.sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 16px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--accent);
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    border: none;
    padding: 11px 16px;
    cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.88; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }

  .auth-msg {
    font-size: 13px;
    margin-top: 14px;
    min-height: 16px;
  }
  .auth-msg.error { color: var(--error); }
  .auth-msg.success { color: var(--live); }

  /* Chat shell */
  #chatBox { display: none; }

  .chat-shell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 560px;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .status.live .status-dot {
    background: var(--live);
    box-shadow: 0 0 8px var(--live);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .status.live { color: var(--live); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .logout-link {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    padding: 4px 8px;
  }
  .logout-link:hover { color: var(--text); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }

  .row.user .bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .row.ai .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  .input-bar input {
    flex: 1;
  }

  .send-btn {
    background: var(--accent);
    color: #fff;
    width: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.88; }
</style>
</head>
<body>

<div class="shell">
  <div class="mark">
    <div class="mark-dot"></div>
    <div class="mark-text">Nexa AI</div>
  </div>

  <!-- Auth Card -->
  <div id="authBox" class="card">
    <h1>Sign in</h1>
    <p class="sub">Connect to your assistant and pick up where you left off.</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" value="test@example.com" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" value="test123" />
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="login()">Sign in</button>
      <button class="btn-ghost" onclick="register()">Create account</button>
    </div>
    <p id="authError" class="auth-msg"></p>
  </div>

  <!-- Chat -->
  <div id="chatBox">
    <div class="chat-shell">
      <div class="chat-header">
        <div class="status disconnected" id="status">
          <div class="status-dot"></div>
          <span id="statusText">Disconnected</span>
        </div>
        <button class="logout-link" onclick="logout()">Sign out</button>
      </div>

      <div id="chat"></div>

      <div class="input-bar">
        <input id="messageInput" type="text" placeholder="Message Nexa..." />
        <button class="send-btn" onclick="sendMessage()" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let ws;
  let currentAiBubble = null;
  let authToken = null;

  async function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://127.0.0.1:8000/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    const msg = document.getElementById("authError");

    if (data.error) {
      msg.className = "auth-msg error";
      msg.innerText = data.error;
    } else {
      msg.className = "auth-msg success";
      msg.innerText = "Account created. Sign in to continue.";
    }
  }

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://127.0.0.1:8000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data.error) {
      const msg = document.getElementById("authError");
      msg.className = "auth-msg error";
      msg.innerText = data.error;
      return;
    }

    authToken = data.access_token;
    document.getElementById("authBox").style.display = "none";
    document.getElementById("chatBox").style.display = "block";
    connectWebSocket();
  }

  function logout() {
    if (ws) ws.close();
    authToken = null;
    document.getElementById("authBox").style.display = "block";
    document.getElementById("chatBox").style.display = "none";
    document.getElementById("chat").innerHTML = "";
  }

  function setStatus(connected, label) {
    const statusEl = document.getElementById("status");
    document.getElementById("statusText").innerText = label;
    statusEl.className = connected ? "status live" : "status disconnected";
  }

  function connectWebSocket() {
    ws = new WebSocket(`ws://127.0.0.1:8000/ws/chat?token=${authToken}`);

    ws.onopen = () => setStatus(true, "Connected");

    ws.onclose = () => {
      setStatus(false, "Reconnecting...");
      if (authToken) setTimeout(connectWebSocket, 2000);
    };

    ws.onmessage = (event) => {
      if (event.data === "[END]") {
        currentAiBubble = null;
        return;
      }
      if (!currentAiBubble) {
        const row = document.createElement("div");
        row.className = "row ai";
        currentAiBubble = document.createElement("div");
        currentAiBubble.className = "bubble";
        row.appendChild(currentAiBubble);
        document.getElementById("chat").appendChild(row);
      }
      currentAiBubble.innerText += event.data;
      scrollToBottom();
    };
  }

  function scrollToBottom() {
    const chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

    const row = document.createElement("div");
    row.className = "row user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = message;
    row.appendChild(bubble);
    document.getElementById("chat").appendChild(row);
    scrollToBottom();

    ws.send(message);
    input.value = "";
  }

  document.getElementById("messageInput")?.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
